      <path d="M13 35H148" stroke="#37358a" stroke-opacity=".3"/>
      <path d="M15 44v11m4-11v11m7-11v11m3-11v11m7-11v11m9-11v11m3-11v11m5-11v11m7-11v11m4-11v11m8-11v11" stroke="#37358a" stroke-width="2"/>
      <text x="103" y="53" fill="#37358a" font-family="Segoe UI, Arial, sans-serif" font-size="9">Ý TƯỞNG</text>
