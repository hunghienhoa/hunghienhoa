<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="460" viewBox="0 0 1140 460" role="img" aria-labelledby="title desc">
  <title id="title">Xin chào, mình là Hùng Hiền Hòa</title>
  <desc id="desc">Một hộp đầy ý tưởng. Giấy kẻ ô màu kem, chữ xanh tím, nhãn vàng và chiếc hộp có những mẩu giấy nhiều màu.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#33378e" stroke-opacity=".14"/></pattern>
    <pattern id="ridges" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0V8" stroke="#8c4e18" stroke-opacity=".12"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#493a28" flood-opacity=".16"/></filter>
    <symbol id="flower" viewBox="0 0 180 180">
      <path d="M166 73H119L142 32 113 15 90 56 67 15 38 32 61 73H14V107H61L38 148 67 165 90 124 113 165 142 148 119 107H166Z" fill="#56bbdf" stroke="#37358a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M55 84Q70 73 85 84Q70 96 55 84ZM96 85Q111 74 126 85Q111 97 96 85Z" fill="#fff8ec" stroke="#37358a" stroke-width="2"/>
      <ellipse cx="72" cy="85" rx="4" ry="6" fill="#37358a"/><ellipse cx="108" cy="85" rx="4" ry="6" fill="#37358a"/>
      <path d="M80 104Q89 115 98 104" fill="none" stroke="#37358a" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect width="1140" height="460" rx="22" fill="#fff4e3"/>
  <rect x="1" y="1" width="1138" height="458" rx="21" fill="url(#grid)" stroke="#37358a" stroke-opacity=".16"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#37358a">
    <text x="65" y="63" font-size="14" font-weight="700" letter-spacing="3">THIẾT KẾ · KỂ CHUYỆN · KHÁM PHÁ</text>
    <path d="M65 81H565" stroke="#37358a" stroke-opacity=".28"/>
    <text x="66" y="124" font-size="18">Xin chào, mình là</text>
    <text x="58" y="241" font-size="128" font-weight="900" letter-spacing="-7">Hùng.</text>
    <g transform="translate(359 174) rotate(-7)">
      <path d="M-7-29H154V15H-7Z" fill="#ffda38"/>
      <text x="7" y="1" font-size="24" font-weight="700">Hiền Hòa</text>
    </g>
    <text x="65" y="301" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="36">Một hộp đầy ý tưởng.</text>
    <text x="65" y="339" font-size="18">Một chút tò mò. Một chút khác biệt.</text>
    <text x="65" y="367" font-size="18">Và nhiều điều muốn kể cùng bạn.</text>
    <g transform="translate(65 399)">
      <rect width="209" height="29" fill="#ffda38"/>
      <text x="11" y="20" font-size="12" font-weight="700" letter-spacing="1.5">MỞ MỘT CHÚT TÒ MÒ ↗</text>
    </g>
    <text x="540" y="424" font-size="11" letter-spacing="1" text-anchor="end">hunghienhoa.com</text>
  </g>
  <g filter="url(#shadow)">
