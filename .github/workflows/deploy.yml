name: Triển khai hunghienhoa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunghienhoa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Chuẩn bị Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cài thư viện đã khóa phiên bản
        run: npm ci
      - name: Kiểm tra mã nguồn và quyền riêng tư
        run: npm run check
      - name: Tạo bản triển khai
        run: npm run build -- --mode production
      - name: Kiểm tra bản triển khai
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Triển khai lên Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Kiểm tra website thật
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/cloud-smoke.mjs
      - name: Kiểm tra nội dung dành cho agent trên website thật
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/agent-smoke.mjs
      - name: Kiểm tra ads.txt, nội dung blog và đường dẫn công khai
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/adsense-smoke.mjs
