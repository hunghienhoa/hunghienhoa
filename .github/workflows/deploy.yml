name: Triển khai hunghienhoa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunghienhoa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Chuẩn bị Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cài thư viện đã khóa phiên bản
        run: npm ci
      - name: Kiểm tra mã nguồn và quyền riêng tư
        run: npm run check
      - name: Tạo bản triển khai
        run: npm run build -- --mode production
      - name: Kiểm tra bản triển khai
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Cập nhật cơ sở dữ liệu Supabase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Chỉ chạy các migration trong supabase/migrations chưa có trong lịch sử của Supabase.
        # Chạy trước Cloudflare để Worker mới không dùng bảng/policy chưa tồn tại.
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Thiếu GitHub Secret SUPABASE_DB_URL (chuỗi Session pooler của Supabase). Xem DEPLOYMENT.md."
            exit 1
          fi
          npx --yes supabase@2.122.0 db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_TELEMETRY_DISABLED: "1"
      - name: Gỡ chặn nếu vừa sửa Worker trên Dashboard
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # cf deploy luôn chạy strict: nếu phiên bản mới nhất được tạo trên Dashboard (ví dụ vừa thêm GEMINI_API_KEY)
        # nó dừng để khỏi ghi đè. Tạo lại phiên bản y hệt qua API (giữ mã, binding, secret) để nguồn thành "api".
        # exports phải khớp cloudflare.config.ts, sai thì Cloudflare từ chối và bước này báo lỗi.
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          from=$(curl -fsS -H "$auth" "$base" | jq -r '.result[] | select(.id=="hunghienhoa") | .last_deployed_from')
          if [ "$from" != "dash" ]; then echo "Không cần gỡ chặn (lần gần nhất: $from)."; exit 0; fi
          date=$(curl -fsS -H "$auth" "$base/hunghienhoa/settings" | jq -r .result.compatibility_date)
          curl -fsS -X PATCH -H "$auth" -F "settings={\"compatibility_date\":\"$date\",\"exports\":{\"VisitCounter\":{\"type\":\"durable-object\",\"storage\":\"sqlite\"}}};type=application/json" "$base/hunghienhoa/settings" > /dev/null
          echo "Đã tạo lại phiên bản đang chạy qua API để triển khai tiếp."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Triển khai lên Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Kiểm tra website thật
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/cloud-smoke.mjs
      - name: Kiểm tra nội dung dành cho agent trên website thật
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/agent-smoke.mjs
      - name: Kiểm tra ads.txt, nội dung blog và đường dẫn công khai
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node tools/adsense-smoke.mjs
