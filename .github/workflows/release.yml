name: Lưu bản web
on:
  workflow_run:
    workflows: [Triển khai hunghienhoa]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Đóng gói và kiểm tra gói sao lưu
        run: python3 tools/release-backup.py
      - name: Lưu vào GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(cat outputs/release/tag.txt)
          title="Portfolio Hùng Hiền Hòa V.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Phiên bản này đã được lưu."
            exit 0
          fi
          gh release create "$tag" "outputs/release/hunghienhoa-source-$tag.zip" "outputs/release/hunghienhoa-web-$tag.zip" outputs/release/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title "$title" --notes-file outputs/release/notes.md
